<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#faf2e2">
  <title>У нас родился сын! · За Мишаню!</title>
  <meta property="og:title" content="У нас родился сын — Мишаня!">
  <meta property="og:description" content="Приглашаем поднять бокалы за Мишаню.">
  <meta property="og:image" content="https://sergeyrazzhivin.github.io/za-mishanyu/booties.jpg">
  <link rel="preload" href="marck-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Marck Script";
      src: url("marck-cyrillic.woff2") format("woff2");
      font-display: swap;
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }

    @font-face {
      font-family: "Marck Script";
      src: url("marck-latin.woff2") format("woff2");
      font-display: swap;
      unicode-range: U+0000-00FF;
    }

    :root {
      color-scheme: light;
      --ink: #49311e;
      --blue: #304f6b;
      --paper: #fff2d9;
      --gold: #b7802e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(12px, 4vw, 56px);
      background: radial-gradient(ellipse at top, #fffaf1, #efe1c9);
      color: var(--ink);
      font: 1.125rem / 1.5 Georgia, serif;
    }

    .postcard {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.16fr);
      grid-template-areas: "message picture" "location picture";
      align-content: center;
      width: min(100%, 1060px);
      min-height: 540px;
      padding: clamp(26px, 5.5vw, 80px);
      border: 1px solid #bc925a;
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 18px 48px #6f4a2826, 0 3px 8px #6f4a2814;
    }

    .postcard::before {
      content: "";
      position: absolute;
      inset: clamp(8px, 1.6vw, 19px);
      z-index: 1;
      border: 1px solid var(--gold);
      outline: 1px solid #b7802e69;
      outline-offset: 4px;
      border-radius: 3px;
      pointer-events: none;
    }

    .message { grid-area: message; align-self: end; }
    .location { grid-area: location; align-self: start; }
    .message, .location { position: relative; z-index: 1; }

    .announcement {
      margin: 0;
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: bold;
    }

    h1 {
      margin: .02em 0 .12em;
      color: var(--blue);
      font: 400 clamp(3.5rem, 8.5vw, 6rem) / 1.04 "Marck Script", Georgia, serif;
    }

    .invitation {
      margin: 0;
      font-size: clamp(1.125rem, 2.2vw, 1.35rem);
      text-wrap: balance;
    }

    .location {
      width: fit-content;
      margin-top: 28px;
      padding-top: 17px;
      border-top: 1px solid #ba8a4d;
    }

    h2 { margin: 0 0 4px; font-size: 1rem; }
    address { font: normal 1.375rem / 1.35 Georgia, serif; }

    button {
      margin-top: 8px;
      padding: 0;
      min-height: 44px;
      background: transparent;
      color: var(--blue);
      border: 0;
      border-radius: 3px;
      font: 600 .875rem Arial, sans-serif;
      text-decoration: underline;
      text-underline-offset: .23em;
      cursor: pointer;
    }

    button:hover { color: var(--ink); }
    button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

    .illustration {
      position: absolute;
      z-index: 0;
      right: 3.5%;
      top: 50%;
      width: min(53%, 500px);
      height: auto;
      transform: translateY(-50%);
      mask-image: radial-gradient(ellipse 65% 68% at 53% 50%, #000 60%, transparent 96%);
    }

    @media (max-width: 760px) {
      .postcard {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "message" "picture" "location";
        justify-items: center;
        min-height: auto;
        padding: clamp(29px, 7vw, 46px) clamp(18px, 5vw, 35px) 24px;
        text-align: center;
      }

      h1 { font-size: clamp(3.65rem, 15.5vw, 5.5rem); }

      .illustration {
        position: static;
        grid-area: picture;
        transform: none;
        width: min(100%, 372px);
        display: block;
        margin: -10px 0 -12px;
      }

      .location { margin-top: 0; padding-top: 12px; }
    }
  </style>
</head>
<body>
  <main class="postcard" aria-labelledby="title">
    <header class="message">
      <p class="announcement">У нас родился сын!</p>
      <h1 id="title">Мишаня!</h1>
      <p class="invitation">Поздравьте нас!<br>Давайте поднимем бокалы за&nbsp;Мишаню!</p>
    </header>
    <img class="illustration" src="booties.jpg" width="1200" height="1200" alt="">
    <section class="location" aria-labelledby="where">
      <h2 id="where">Место сбора</h2>
      <address>ул. Отечественная, 39</address>
      <button id="copy" type="button" hidden>Скопировать адрес</button>
    </section>
  </main>
  <script>
    const button = document.querySelector('#copy');
    const address = document.querySelector('address');

    if (navigator.clipboard) {
      button.hidden = false;
      button.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(address.textContent);
          button.textContent = 'Адрес скопирован';
        } catch {
          window.getSelection().selectAllChildren(address);
          button.textContent = 'Адрес выделен';
        }
      });
    }
  </script>
</body>
</html>
